<footer class="modulex-alt-akordeon{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-alt-akordeon-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>

<style>
  /* alt-akordeon — Uzun bağlantı listeleri mobilde ekranı doldurmaz: sütunlar mobilde katlanır, masaüstünde düz sütundur. */
  .modulex-alt-akordeon { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-alt-akordeon *, .modulex-alt-akordeon *::before, .modulex-alt-akordeon *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-alt-akordeon :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-alt-akordeon :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-alt-akordeon :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-alt-akordeon :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-alt-akordeon img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-alt-akordeon) img { height: auto; }
  .modulex-alt-akordeon [hidden] { display: none !important; }
  .modulex-alt-akordeon :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-alt-akordeon :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-alt-akordeon-ic { max-width: --max--; margin-inline: auto; }
  .modulex-alt-akordeon-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-alt-akordeon--bassiz .modulex-alt-akordeon-bas { display: none; }
  .modulex-alt-akordeon-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-alt-akordeon-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-alt-akordeon-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-alt-akordeon-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-alt-akordeon-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-alt-akordeon-dugme:hover { transform: translateY(-2px); }
  .modulex-alt-akordeon-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-alt-akordeon-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-alt-akordeon-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-alt-akordeon-bag { color: inherit; text-decoration: none; transition: color 0.2s ease; }
  .modulex-alt-akordeon-bag:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-alt-akordeon-bag[aria-current="page"] { color: --accentInk--; font-weight: 700; }
  .modulex-alt-akordeon-logo { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .modulex-alt-akordeon-logo img { width: auto; max-height: --logoH--; }
  .modulex-alt-akordeon-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-alt-akordeon-bbaslik { margin-block-end: 14px; color: --accentInk--; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-alt-akordeon-sayfalar, .modulex-alt-akordeon-baglantilar, .modulex-alt-akordeon-iletisim, .modulex-alt-akordeon-yasal { display: grid; gap: 9px; }
  .modulex-alt-akordeon-il { display: flex; align-items: flex-start; gap: 10px; }
  .modulex-alt-akordeon-il-ic { display: grid; gap: 2px; }
  .modulex-alt-akordeon-il-etiket { color: --muted--; font-size: 0.8rem; }
  .modulex-alt-akordeon-il-ikon { flex: none; color: --accentInk--; font-size: 20px; }
  .modulex-alt-akordeon-saatler { display: grid; gap: 6px; }
  .modulex-alt-akordeon-saat { display: flex; justify-content: space-between; gap: 16px; }
  .modulex-alt-akordeon-saat dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .modulex-alt-akordeon-sosyal { display: flex; flex-wrap: wrap; gap: 10px; }
  .modulex-alt-akordeon-sosyal-a { display: inline-grid; place-items: center; width: 42px; height: 42px; border: 1px solid --cizgi--; border-radius: 50%; color: inherit; font-size: 18px; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease; }
  .modulex-alt-akordeon-sosyal-a:hover { border-color: --accent--; background: --accent--; color: --accentText--; transform: translateY(-2px); }
  .modulex-alt-akordeon-hakkinda { max-width: 46ch; color: --muted--; }
  .modulex-alt-akordeon-telif { display: flex; flex-wrap: wrap; gap: 4px 14px; color: --muted--; font-size: 0.9rem; }
  .modulex-alt-akordeon-dil:empty { display: none; }
  .modulex-alt-akordeon-yukari { display: inline-grid; place-items: center; flex: none; width: 46px; height: 46px; border-radius: 50%; background: --accent--; color: --accentText--; text-decoration: none; transition: transform 0.25s ease; }
  .modulex-alt-akordeon-yukari:hover { transform: translateY(-3px); }
  .modulex-alt-akordeon-bulten { display: grid; gap: 8px; }
  .modulex-alt-akordeon-nl-etiket { font-size: 0.9rem; font-weight: 700; }
  .modulex-alt-akordeon-nl-satir { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-alt-akordeon-nl-girdi { flex: 1 1 200px; min-width: 0; min-height: 48px; padding: 10px 18px; border: 1px solid --cizgi--; border-radius: 999px; background: --bg--; color: --text--; font: inherit; }
  .modulex-alt-akordeon-nl-dugme { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 10px 22px; border: 0; border-radius: 999px; background: --accent--; color: --accentText--; font: inherit; font-weight: 700; transition: transform 0.2s ease; }
  .modulex-alt-akordeon-nl-dugme:hover { transform: translateY(-2px); }
  .modulex-alt-akordeon-nl-dugme .material-symbols-outlined { font-size: 18px; }
  .modulex-alt-akordeon-nl-durum:empty { display: none; }
  .modulex-alt-akordeon-nl-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .modulex-alt-akordeon-nl-metin { color: --muted--; }

  .modulex-alt-akordeon-tepe { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px; margin-block-end: 36px; }
  .modulex-alt-akordeon-sutunlar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
  .modulex-alt-akordeon-ozet { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-block-end: 14px; color: --accentInk--; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; list-style: none; }
  .modulex-alt-akordeon-ozet::-webkit-details-marker { display: none; }
  .modulex-alt-akordeon-ozet .material-symbols-outlined { display: none; transition: transform 0.3s ease; }
  .modulex-alt-akordeon-dt[open] .modulex-alt-akordeon-ozet .material-symbols-outlined { transform: rotate(180deg); }
  .modulex-alt-akordeon-alt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-block-start: 36px; padding-block-start: 20px; border-block-start: 1px solid --cizgi--; }
  .modulex-alt-akordeon-yasal { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.9rem; }
  @media (max-width: 1024px) {
    .modulex-alt-akordeon-sutunlar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 768px) {
    .modulex-alt-akordeon-sutunlar { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .modulex-alt-akordeon-dt { border-block-end: 1px solid --cizgi--; }
    .modulex-alt-akordeon-ozet { min-height: 52px; margin: 0; }
    .modulex-alt-akordeon-ozet .material-symbols-outlined { display: inline-block; }
    .modulex-alt-akordeon-dt-ic { padding-block-end: 18px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-akordeon :is(.modulex-alt-akordeon-baslik, .modulex-alt-akordeon-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-akordeon-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-alt-akordeon { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-alt-akordeon *, .modulex-alt-akordeon *::before, .modulex-alt-akordeon *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-alt-akordeon";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const akordeon = (s) => {
          const d = [...s.querySelectorAll("details[data-akordeon]")];
          if (!d.length || !window.matchMedia) return;
          const m = window.matchMedia("(max-width: 768px)");
          const uygula = () => d.forEach((x) => { x.open = !m.matches; });
          uygula();
          m.addEventListener("change", uygula);
          d.forEach((x) => x.querySelector("summary").addEventListener("click", (e) => { if (!m.matches) e.preventDefault(); }));
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      akordeon(s, P, az);
    });
  })();
</script>
