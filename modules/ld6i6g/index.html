</style>
<script>
  (() => {
    const P = "modulex-randevu-cam-kart";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const randevu = (s, P) => {
        const dl = document.documentElement.lang || undefined;
        const iso = (t) => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
        const isoGun = (t) => ((t.getDay() + 6) % 7) + 1;
        const coz = (v) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
        const bicim = (o) => { try { return new Intl.DateTimeFormat(dl, o); } catch (x) { return null; } };
        const uzun = bicim({ weekday: "long", day: "numeric", month: "long", year: "numeric" });
        const tarihYaz = (v) => { const t = coz(v); return t && uzun ? uzun.format(t) : v || ""; };
        s.querySelectorAll("form[data-fb-randevu]").forEach((f) => {
          const d = f.dataset;
          s.classList.add(P + "--rjs");
          const gunler = String(d.gunler || "1,2,3,4,5,6,7").split(",").map(Number);
          const kapali = String(d.kapali || "").split(",").filter(Boolean);
          const acikMi = (t) => gunler.includes(isoGun(t)) && !kapali.includes(iso(t));
          const bugun = new Date();
          bugun.setHours(0, 0, 0, 0);
          const ilkGun = new Date(bugun);
          ilkGun.setDate(ilkGun.getDate() + (Number(d.onGun) || 0));
          const sonGun = new Date(bugun);
          sonGun.setDate(sonGun.getDate() + (Number(d.azamiGun) || 60));
          const durum = f.querySelector("[role=status]");
          const yaz = (m, hata) => { if (durum) { durum.textContent = m || ""; durum.classList.toggle(P + "-durum--hata", !!hata); } };
          const al = (ad) => { const e = f.elements.namedItem(ad); return e && "value" in e ? String(e.value).trim() : ""; };
          let t0 = Date.now();
          /* tarih: sınır + kapalı gün */
          const tarih = f.querySelector("input[type=date]");
          const kontrol = () => { if (!tarih) return; const t = coz(tarih.value); tarih.setCustomValidity(t && !acikMi(t) ? d.kapaliMesaj || "" : ""); };
          if (tarih) {
            tarih.min = iso(ilkGun);
            tarih.max = iso(sonGun);
            tarih.addEventListener("change", kontrol);
            tarih.addEventListener("input", kontrol);
          }
          /* gün şeridi: açık günlerden N düğme (yerel dilde gün adı); varsa yerel tarih alanının yerine geçer */
          const serit = f.querySelector("[data-gun-serit]");
          if (serit && tarih) {
            const adet = Number(serit.dataset.gunSerit) || 14;
            const fa = bicim({ weekday: "short" });
            const fg = bicim({ day: "numeric" });
            const fy = bicim({ month: "short" });
            const t = new Date(ilkGun);
            let n = 0;
            for (let g = 0; n < adet && t <= sonGun && g < 400; g++) {
              if (acikMi(t)) {
                const l = document.createElement("label");
                l.className = P + "-gun";
                const r = document.createElement("input");
                r.type = "radio";
                r.name = "date";
                r.value = iso(t);
                r.className = P + "-radyo";
                r.dataset.tarih = "1";
                r.dataset.etiket = tarih.dataset.etiket || "";
                if (!n) r.required = true;
                l.append(r);
                [[fa, "gad"], [fg, "gno"], [fy, "gay"]].forEach(([b, k]) => { const sp = document.createElement("span"); sp.className = P + "-" + k; sp.textContent = b ? b.format(t) : iso(t); l.append(sp); });
                serit.append(l);
                n++;
              }
              t.setDate(t.getDate() + 1);
            }
            if (n) {
              const kap = f.querySelector("[data-gun-kap]");
              const yerel = f.querySelector("[data-tarih-alan]");
              if (kap) kap.hidden = false;
              if (yerel) yerel.hidden = true;
              tarih.disabled = true;
            }
          }
          /* kişi sayacı */
          f.querySelectorAll("[data-arti], [data-eksi]").forEach((b) => b.addEventListener("click", () => {
            const e = f.querySelector("#" + (b.dataset.arti || b.dataset.eksi));
            if (!e) return;
            if (b.dataset.arti) e.stepUp(); else e.stepDown();
            e.dispatchEvent(new Event("input", { bubbles: true }));
          }));
          /* satırlar: alan etiketi (data-etiket) + okunur değer; seçimde seçenek yazısı, tarihte yerel uzun tarih */
          const satirlar = () => {
            const out = [];
            const gor = new Set();
            [...f.elements].forEach((e) => {
              if (!e.name || e.disabled || gor.has(e.name) || ["website", "kvkk", "fb-kanal"].includes(e.name) || e.type === "submit" || e.type === "button") return;
              let v = "";
              if (e.type === "radio") {
                const c = [...f.elements].find((x) => x.name === e.name && x.checked && !x.disabled);
                if (!c) return;
                v = c.dataset.tarih ? tarihYaz(c.value) : c.dataset.metin || c.value;
              } else if (e.type === "checkbox") {
                if (!e.checked) return;
                v = e.dataset.metin || e.value;
              } else if (e.tagName === "SELECT") {
                if (!e.value) return;
                v = e.options[e.selectedIndex].text.trim();
              } else if (e.type === "date") v = tarihYaz(e.value);
              else v = String(e.value).trim();
              gor.add(e.name);
              if (v) out.push({ ad: e.name, et: e.dataset.etiket || e.name, v });
            });
            return out;
          };
          /* canlı özet: [data-ozet] listeleri (form dışında da olabilir, modül içinde) */
          const ozet = () => {
            const L = satirlar().filter((x) => x.ad !== "message");
            s.querySelectorAll("[data-ozet]").forEach((o) => {
              o.replaceChildren(...L.map((x) => { const li = document.createElement("li"); const b = document.createElement("b"); b.textContent = x.et; const sp = document.createElement("span"); sp.textContent = x.v; li.append(b, sp); return li; }));
            });
            s.classList.toggle(P + "--ozetli", L.length > 0);
          };
          f.addEventListener("input", ozet);
          f.addEventListener("change", ozet);
          /* adım sihirbazı: [data-adim] alan grupları, [data-ileri] / [data-geri], [data-adim-isaret] göstergeleri, --adim (0…1) */
          const adimlar = [...f.querySelectorAll("[data-adim]")];
          const isaret = [...s.querySelectorAll("[data-adim-isaret]")];
          let ai = 0;
          const goster = (n, odak) => {
            ai = n;
            adimlar.forEach((a, j) => { a.hidden = j !== n; });
            isaret.forEach((x, j) => { if (j === n) x.setAttribute("aria-current", "step"); else x.removeAttribute("aria-current"); x.classList.toggle(P + "--tamam", j < n); });
            s.style.setProperty("--adim", String(adimlar.length > 1 ? n / (adimlar.length - 1) : 1));
            f.querySelectorAll("[data-geri]").forEach((b) => { b.hidden = n === 0; });
